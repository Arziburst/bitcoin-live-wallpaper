name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore BitcoinWallpaper.sln

      - name: Build
        run: dotnet build BitcoinWallpaper.sln -c Release --no-restore

      - name: Test
        run: dotnet test BitcoinWallpaper.sln -c Release --no-build --logger "console;verbosity=normal"

      # Headless (WIC, software Direct2D) PNGs of the recorded snapshot; the golden-image test compares the same.
      - name: Render fixture mockups
        run: dotnet run --project tools/RenderMockup -c Release --no-build -- --offline --out mockups

      - name: Upload mockups and golden-image failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mockups
          path: |
            mockups/
            tests/Chart.Render.Tests/bin/Release/net10.0-windows/golden-failures/
          if-no-files-found: ignore
